name: ReconForge CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Run live-path tests
        run: python -m pytest -q

      - name: Run precision benchmark
        run: python benchmarks/runner.py benchmarks/cases

      - name: Run regression corpus
        run: python benchmarks/regression/runner.py benchmarks/regression

      - name: Run release gate
        run: |
          python -c 'from reconforge.release import evaluate; r=evaluate(benchmark_file="benchmarks/cases/authorization_boundary.json", regression_dir="benchmarks/regression"); [print(f"{\"PASS\" if g.passed else \"FAIL\"} {g.name}: {g.detail}") for g in r.gates]; raise SystemExit(0 if r.ready else 2)'
