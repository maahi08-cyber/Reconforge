name: ReconForge CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Run live-path tests
        run: python -m pytest -q

      - name: Run precision benchmark
        run: python benchmarks/runner.py benchmarks/cases

      - name: Run regression corpus
        run: python benchmarks/regression/runner.py benchmarks/regression

      - name: Run release gate
        run: |
          python - <<'PY'
          from reconforge.release import evaluate

          report = evaluate(
              benchmark_file="benchmarks/cases/authorization_boundary.json",
              regression_dir="benchmarks/regression",
          )
          for gate in report.gates:
              state = "PASS" if gate.passed else "FAIL"
              print(f"{state} {gate.name}: {gate.detail}")
          raise SystemExit(0 if report.ready else 2)
          PY
