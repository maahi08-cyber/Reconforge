name: ReconForge CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
          python -m pip check

      - name: Compile source and test trees
        run: python -m compileall -q src benchmarks tests

      - name: Run live-path tests
        run: python -m pytest -q

      - name: Run precision benchmark
        run: python benchmarks/runner.py benchmarks/cases

      - name: Run regression corpus
        run: python benchmarks/regression/runner.py benchmarks/regression

      - name: Run release gate
        run: |
          reconforge release-check \
            --benchmark-corpus benchmarks/cases/authorization_boundary.json \
            --regression-dir benchmarks/regression
